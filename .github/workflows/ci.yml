name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  qualidade:
    name: Lint, formatação e testes (sem banco externo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instala dependências
        run: pip install -r requirements-dev.txt

      - name: Formatação (black)
        run: black --check app tests migrations

      - name: Lint (flake8)
        run: flake8 app tests migrations

      - name: Testes com cobertura
        # Os testes marcados `db` são pulados aqui e rodam no job abaixo — por
        # isso o piso é 90%: o adaptador PostGIS é coberto lá, não aqui.
        run: pytest -q --cov --cov-fail-under=90

  integracao-postgis:
    name: Integração com PostGIS real
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: partners_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d partners_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instala dependências
        run: pip install -r requirements-dev.txt

      - name: Testes contra o PostGIS (inclui as migrations e o EXPLAIN)
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://app:app@localhost:5432/partners_test
        run: pytest -q -m db
