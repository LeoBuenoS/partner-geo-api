services:
  api:
    build: .
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_DB: ${POSTGRES_DB:-partners}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REPOSITORIO: postgis
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy

  postgis:
    # A imagem oficial do PostgreSQL nao traz a extensao; esta traz.
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-partners}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-partners}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
